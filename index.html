<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>
            Stem for You
        </title>
    </head>
    <body>
        <div class="container">
            <header class="header">
                <span class="badge">高校生向け進路診断</span>
                <h1><strong>CSの科目選択</strong></h1>
                <p class="subtitle">あなたにぴったりのコンピューターサイエンスの学び方や高校での科目選択ルートを見つける診断</p>
            </header>

            <form id="quizForm">
                <div class="question-card">
                    <div class="question-title">1. 現在の文理への興味を教えて</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s1" value="1" required> 理系</label>
                        <label class="option-label"><input type="radio" name="s1" value="2"> 文系</label>
                        <label class="option-label"><input type="radio" name="s1" value="3"> まだわからない</label>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">2. 数学への意欲はどのくらい？</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s2" value="A" required> 好き</label>
                        <label class="option-label"><input type="radio" name="s2" value="B" required> 普通</label>
                        <label class="option-label"><input type="radio" name="s2" value="C" required> 苦手</label>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">3. 数IIIは取ろうと思う・または取っている？</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s3" value="y" required> はい（取る / 取っている）</label>
                        <label class="option-label"><input type="radio" name="s3" value="n" required> いいえ（取らない）</label>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">4. 将来やってみたいことは？</div>
                    <div class="select-wrapper">
                        <select id="s4" class="custom-select">
                            <option value="1">アプリ開発</option>
                            <option value="2">AI研究</option>
                            <option value="3">ゲーム制作</option>
                            <option value="4">Webデザイン</option>
                            <option value="5">UI/UXデザイン</option>
                            <option value="6">ビジネス企画</option>
                            <option value="7">マーケティング</option>
                            <option value="8">データ分析</option>
                            <option value="9">社会問題の解決</option>
                        </select>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">5. 何かを作るとしたら、どっちにワクワクする？</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s5" value="1" required> パズルのような謎解きや、仕組み・ロジックを考えること</label>
                        <label class="option-label"><input type="radio" name="s5" value="2"> イラストを描く、動画を作る、見た目をデザインすること</label>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">6. スマホのアプリがバグったり不便な時、どう思う？</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s6" value="1" required> 「なんでこうなるんだろう？」と原因や裏側の仕組みを調べたくなる</label>
                        <label class="option-label"><input type="radio" name="s6" value="2"> 「もっとこうなれば使いやすいのに」と新しいアイデアを考える方が楽しい</label>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-title">7. 一番時間を忘れて熱中できる瞬間はどれ？</div>
                    <div class="options">
                        <label class="option-label"><input type="radio" name="s7" value="1" required> 1人で黙々と作業して、パズルを解くように形を完成させていくとき（個人作業）</label>
                        <label class="option-label"><input type="radio" name="s7" value="2"> 友達とアイデアを出し合ったり、全体の計画を立てて進め方をまとめるとき（チーム）</label>
                    </div>
                </div>

                <button type="button" class="submit-btn" onclick="calculateResult()">診断結果を見る</button>
            </form>

            <div id="result" class="result-card">
                <h2 class="result-title">【診断結果】おすすめの進路</h2>
                <div id="resultContent"></div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
